                0
            );
            transition: transform 0.25s ease-out;
            animation: floatSlow 12s ease-in-out infinite reverse;

        function slugifyCouple(name, fallbackId = '') {
            const base = String(name || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
            return base || String(fallbackId || 'client');
        }

        function getClientSlug(client) {
            if (!client) return '';
            return client.coupleSlug || slugifyCouple(client.coupleShort, client.id);
        }

        function findClientBySlug(slug) {
            if (!slug || !appState?.clients) return null;
            const clean = String(slug).trim().toLowerCase();
            return appState.clients.find((c) =>
                getClientSlug(c).toLowerCase() === clean ||
                String(c.id || '').toLowerCase() === clean ||
                String(c.username || '').toLowerCase() === clean
            ) || null;
        }

        function parseClientRoute() {
            const hash = String(window.location.hash || '').replace(/^#/, '');
            if (hash.startsWith('client/')) {
                return decodeURIComponent(hash.slice('client/'.length).split('?')[0].trim()) || null;
            }
            const params = new URLSearchParams(window.location.search || '');
            const qClient = params.get('client');
            return qClient ? qClient.trim() : null;
        }

        function buildClientPageUrl(client) {
            const slug = getClientSlug(client);
            const base = window.location.href.split('#')[0].split('?')[0];
            return `${base}#client/${encodeURIComponent(slug)}`;
        }

        function applyRequestedClientRoute() {
            requestedClientSlug = parseClientRoute();
            if (!requestedClientSlug) {
                clientPageMode = currentUser?.role === 'client';
                return;
            }
            const matched = findClientBySlug(requestedClientSlug);
            if (!currentUser) {
                if (matched) {
                    activeClientId = matched.id;
                    activeEventId = matched.events?.[0]?.id || null;
                }
                return;
            }
            if (currentUser.role === 'client') {
                const ownClient = appState.clients.find((c) => c.id === currentUser.clientId);
                if (ownClient) {
                    activeClientId = ownClient.id;
                    if (!ownClient.events?.some((e) => e.id === activeEventId)) {
                        activeEventId = ownClient.events?.[0]?.id || null;
                    }
                    clientPageMode = true;
                }
            } else if (matched) {
                activeClientId = matched.id;
                if (!matched.events?.some((e) => e.id === activeEventId)) {
                    activeEventId = matched.events?.[0]?.id || null;
                }
                clientPageMode = true;
            }
        }

        function copyClientPageLink() {
            const client = getActiveClient();
            if (!client) return;
            const url = buildClientPageUrl(client);
            const tmp = document.createElement('textarea');
            tmp.value = url;
            tmp.style.position = 'fixed';
            tmp.style.opacity = '0';
            document.body.appendChild(tmp);
            tmp.select();
            try {
                document.execCommand('copy');
                showToast(`Link Client Page disalin: ${url}`, 'success');
            } catch (_) {
                showToast(`Link Client Page: ${url}`, 'info');
            }
            document.body.removeChild(tmp);
        }

        function toggleClientPageViewMode() {
            const client = getActiveClient();
            if (!client || currentUser?.role === 'client') return;
            clientPageMode = !clientPageMode;
            if (clientPageMode) {
                window.location.hash = 'client/' + encodeURIComponent(getClientSlug(client));
            } else if (window.location.hash.startsWith('#client/')) {
                try {
                    if (window.location.protocol !== 'blob:') {
                        history.replaceState(null, '', window.location.pathname + window.location.search);
                    } else {
                        window.location.hash = '';
                    }
                } catch (_) {
                    window.location.hash = '';
                }
            }
            const allowed = getAllowedTabsForCurrentUser(client);
            if (!allowed.includes(activeTab)) activeTab = allowed[0] || 'vendor';
            renderApp();
        }

        function detectDeviceMode() {
            if (deviceOverride !== 'auto') return deviceOverride;
            const w = window.innerWidth;
            if (w < 640) return 'mobile';
            if (w < 1024) return 'tablet';
            return 'desktop';
        }

        function applyDeviceMode() {
            const mode = detectDeviceMode();
            document.documentElement.setAttribute('data-device', mode);
            document.documentElement.setAttribute('data-device-override', deviceOverride);
        }

        function setDeviceOverride(mode) {
            deviceOverride = mode;
            applyDeviceMode();
            renderApp();
        }

        function initParallaxListeners() {
            const onScroll = () => {
                const y = window.scrollY || window.pageYOffset || 0;
                document.documentElement.style.setProperty('--parallax-scroll-y', `${y}px`);
            };
            const onPointerMove = (e) => {
                if (detectDeviceMode() === 'mobile') return;
                const nx = (e.clientX / Math.max(1, window.innerWidth) - 0.5) * 28;
                const ny = (e.clientY / Math.max(1, window.innerHeight) - 0.5) * 28;
                document.documentElement.style.setProperty('--parallax-ptr-x', `${nx.toFixed(1)}px`);
                document.documentElement.style.setProperty('--parallax-ptr-y', `${ny.toFixed(1)}px`);
            };
            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('pointermove', onPointerMove, { passive: true });
            window.addEventListener('resize', () => {
                applyDeviceMode();
            });
            window.addEventListener('hashchange', () => {
                applyRequestedClientRoute();
                renderApp();
            });
        }

        function normalizeState(raw) {
            const base = getDefaultState();
            if (!raw || typeof raw !== 'object') return base;
            const merged = {
                ...base,
                ...raw,
                staffUsers: Array.isArray(raw.staffUsers) && raw.staffUsers.length ? raw.staffUsers : base.staffUsers,
                clients: Array.isArray(raw.clients) && raw.clients.length ? raw.clients : base.clients,
            };
            merged.clients = merged.clients.map((c) => {
                const events = Array.isArray(c.events) && c.events.length ? c.events : base.clients[0].events;
                const baseOrder = Array.isArray(c.tabOrder) && c.tabOrder.length ? c.tabOrder.filter((t) => TAB_META[t]) : [...DEFAULT_TABS];
                if (!baseOrder.includes('vendorlist')) {
                    const vIdx = baseOrder.indexOf('vendor');
                    baseOrder.splice(vIdx >= 0 ? vIdx + 1 : 1, 0, 'vendorlist');
                }
                const crewTabs = Array.isArray(c.roleAccess?.crewTabs) ? [...c.roleAccess.crewTabs] : [...base.clients[0].roleAccess.crewTabs];
                if (!crewTabs.includes('vendorlist')) crewTabs.push('vendorlist');
                const clientTabs = Array.isArray(c.roleAccess?.clientTabs) ? [...c.roleAccess.clientTabs] : [...base.clients[0].roleAccess.clientTabs];
                if (!clientTabs.includes('vendorlist')) clientTabs.push('vendorlist');

                return {
                    ...base.clients[0],
                    ...c,
                    coupleSlug: c.coupleSlug || slugifyCouple(c.coupleShort, c.id),
                    packageItems: Array.isArray(c.packageItems) && c.packageItems.length
                        ? c.packageItems
                        : [{ id: `pkg-${Date.now()}`, title: c.packageTier || 'Paket WO', description: c.packageDescription || 'Layanan pendampingan & koordinasi acara.', price: 10000000 }],
                    tabOrder: baseOrder,
                    roleAccess: {
                        ...(c.roleAccess || {}),
                        crewTabs,
                        clientTabs,
                    },
                    events: events.map((ev) => ({
                        ...base.clients[0].events[0],
                        ...ev,
                        vendors: Array.isArray(ev.vendors) ? ev.vendors.map((v) => ({
                            ...v,
                            pic: v.pic || [v.picName, v.picPhone ? `(${v.picPhone})` : ''].filter(Boolean).join(' '),
                            checklist: Array.isArray(v.checklist) ? v.checklist.map((ch) => ({
                                ...ch,
                                label: ch.label || ch.title || '',
                            })) : [],
                            updates: Array.isArray(v.updates) ? v.updates : [],
                        })) : [],
                        confirmedVendorList: Array.isArray(ev.confirmedVendorList) ? ev.confirmedVendorList : [],
                        woProgress: {
                            ...createDefaultWoProgress(ev.eventName, ev.venue),
                            ...(ev.woProgress || {}),
                            rundown: Array.isArray(ev.woProgress?.rundown) ? ev.woProgress.rundown : [],
                            revisions: Array.isArray(ev.woProgress?.revisions) ? ev.woProgress.revisions : [],

        async function syncFromRemoteServer(silent = true) {
            try {
                const res = await fetch(`${GAS_EXEC_URL}?action=getState&t=${Date.now()}`);
                const data = await res.json();
                const remoteState = data?.state || data?.MAIN_STATE || (Array.isArray(data?.clients) ? data : null);
                if (remoteState && Array.isArray(remoteState.clients) && remoteState.clients.length) {
                    appState = normalizeState(remoteState);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                    if (!appState.clients.some((c) => c.id === activeClientId)) {
                        activeClientId = appState.clients[0]?.id || null;
                    }
                    const cl = getActiveClient();
                    if (cl && !cl.events.some((e) => e.id === activeEventId)) {
                        activeEventId = cl.events[0]?.id || null;
                    }
                    applyRequestedClientRoute();
                    renderApp();
                    if (!silent) showToast('Database berhasil disinkronkan.', 'success');
                }
            } catch (_) {
                if (!silent) showToast('Menggunakan data cache lokal.', 'info');
            }
        }

        function loadInitialState() {
            try {
                const savedSession = sessionStorage.getItem(SESSION_KEY);
                if (savedSession) currentUser = JSON.parse(savedSession);
            } catch (_) {
                currentUser = null;
            }

            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    appState = normalizeState(JSON.parse(raw));
                } else {
                    appState = getDefaultState();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                }
            } catch (err) {
                appState = getDefaultState();
            }

            if (appState.clients.length > 0) {
                activeClientId = appState.clients[0].id;
                activeEventId = appState.clients[0].events[0]?.id || null;
            }

            applyRequestedClientRoute();

            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler((remoteState) => {
                        if (remoteState) {
                            appState = normalizeState(remoteState);
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                            applyRequestedClientRoute();
                            renderApp();
                        }
                    })
                    .withFailureHandler(() => {})
                    .getAppStateFromSheet();
            } else {
                syncFromRemoteServer(true);
            }
        }

        function saveAppData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (err) {
                showToast('Gagal menyimpan ke penyimpanan lokal.', 'error');
            }
            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withFailureHandler(() => {})
                    .saveAppStateToSheet(appState);
            } else {
                fetch(GAS_EXEC_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'saveState', key: 'MAIN_STATE', state: appState }),
                }).catch(() => {});
            }
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatRupiah(num) {
            const n = Number(num) || 0;
            return 'Rp ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        function formatDateIndo(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr + 'T00:00:00');
            if (Number.isNaN(d.getTime())) return dateStr;
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agt', 'Sep', 'Okt', 'Nov', 'Des'];
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function sanitizePhone(raw) {
            let digits = String(raw || '').replace(/\D/g, '');
            if (!digits) return '';
            if (digits.startsWith('0')) digits = '62' + digits.slice(1);
            return digits;
        }

        function getDaysCountdownText(dateStr) {
            if (!dateStr) return '';
            const target = new Date(dateStr + 'T00:00:00');
            if (Number.isNaN(target.getTime())) return '';
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
            if (diffDays > 0) return `H-${diffDays} Menuju Acara`;
            if (diffDays === 0) return 'Hari-H Acara!';
            return `Selesai (${Math.abs(diffDays)} hari lalu)`;
        }

        function openWhatsAppMessage(rawPhone, messageText) {
            const phone = sanitizePhone(rawPhone);
            const encoded = encodeURIComponent(String(messageText || ''));
            const url = phone
                ? `https://api.whatsapp.com/send?phone=${phone}&text=${encoded}`
                : `https://api.whatsapp.com/send?text=${encoded}`;
            const win = window.open(url, '_blank', 'noopener,noreferrer');
            if (!win) {
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                document.body.appendChild(a);
                a.click();
                a.remove();
            }
        }

            const printArea = document.getElementById('print-area');
            printArea.innerHTML = htmlContent;
            setTimeout(() => {

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const colorClass =
                type === 'error'
                    ? 'bg-red-600 text-white'
                    : type === 'success'
                    ? 'bg-sage-700 text-white'
                    : 'bg-charcoal-900 text-white';
            el.className = `px-4 py-2.5 rounded-2xl shadow-lg text-xs font-semibold ${colorClass} pointer-events-auto transition-all`;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 220);
            }, 2600);
        }

            if (!client || !Array.isArray(client.events) || !client.events.length) return null;

        function isEffectiveClientView() {
            return currentUser?.role === 'client' || clientPageMode;

        function getAllowedTabsForCurrentUser(client) {
            const order = Array.isArray(client?.tabOrder) && client.tabOrder.length
                ? client.tabOrder.filter((t) => TAB_META[t])
                : [...DEFAULT_TABS];
            if (!currentUser) return order;
            if (isEffectiveClientView()) {
                const allowed = client?.roleAccess?.clientTabs || ['vendor', 'vendorlist', 'rundown', 'biodata', 'package', 'brief'];
                return order.filter((t) => allowed.includes(t));
            }
            if (currentUser.role === 'admin') return order;
            if (currentUser.role === 'crew') {
                const allowed = client?.roleAccess?.crewTabs || ['vendor', 'vendorlist', 'rundown', 'biodata', 'brief', 'ops'];
                return order.filter((t) => allowed.includes(t));
            }
            return order;
        }

        function getTabPermissionMode(client, tabKey = activeTab) {
            if (!currentUser) return 'view';
            if (currentUser.role === 'admin' && !clientPageMode) return 'edit';
            if (isEffectiveClientView()) {
                const mode = client?.roleAccess?.clientPermissions?.[tabKey];
                return mode === 'edit' ? 'edit' : 'view';
            }
            if (currentUser.role === 'crew') {
                const mode = client?.roleAccess?.crewPermissions?.[tabKey];
                return mode === 'view' ? 'view' : 'edit';
            }
            return 'view';
        }

        function canEditCurrentTab(client, tabKey = activeTab) {
            return getTabPermissionMode(client, tabKey) === 'edit';
        }

        function computeRundownDurationText(timeRange, savedDuration) {
            if (savedDuration && String(savedDuration).trim()) return String(savedDuration).trim();
            const match = String(timeRange || '').match(/(\d{1,2})[:.](\d{2})\s*-\s*(\d{1,2})[:.](\d{2})/);
            if (!match) return '';
            const startMin = Number(match[1]) * 60 + Number(match[2]);
            let endMin = Number(match[3]) * 60 + Number(match[4]);
            if (endMin < startMin) endMin += 24 * 60;
            const diff = endMin - startMin;
            if (diff <= 0) return '';
            const hrs = Math.floor(diff / 60);
            const mins = diff % 60;
            const parts = [];
            if (hrs > 0) parts.push(`${hrs} jam`);
            if (mins > 0) parts.push(`${mins} menit`);
            return `Durasi ${parts.join(' ')} (${diff} mnt)`;
        }

        function recalcVendorProgress(vendor) {
            if (!vendor || !Array.isArray(vendor.checklist) || vendor.checklist.length === 0) return;
            const doneCount = vendor.checklist.filter((c) => c.done).length;
            vendor.progress = Math.round((doneCount / vendor.checklist.length) * 100);
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const u = (document.getElementById('login-username')?.value || '').trim();
            const p = (document.getElementById('login-password')?.value || '').trim();

            const staff = (appState.staffUsers || []).find(
                (s) => s.username.toLowerCase() === u.toLowerCase() && String(s.password) === p
            );
            if (staff) {
                currentUser = { role: staff.role, name: staff.name, username: staff.username, clientId: null };
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
                if (appState.clients.length > 0 && !activeClientId) {
                    activeClientId = appState.clients[0].id;
                    activeEventId = appState.clients[0].events[0]?.id || null;
                }
                applyRequestedClientRoute();
                const allowed = getAllowedTabsForCurrentUser(getActiveClient());
                activeTab = allowed[0] || 'vendor';
                showToast(`Selamat datang, ${staff.name}!`, 'success');
                renderApp();
                return;
            }

            const client = (appState.clients || []).find(
                (c) => c.username.toLowerCase() === u.toLowerCase() && String(c.password) === p
            );
            if (client) {
                currentUser = { role: 'client', name: client.coupleShort, username: client.username, clientId: client.id };
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
                activeClientId = client.id;
                activeEventId = client.events[0]?.id || null;
                clientPageMode = true;
                window.location.hash = 'client/' + encodeURIComponent(getClientSlug(client));
                const allowed = getAllowedTabsForCurrentUser(client);
                activeTab = allowed[0] || 'vendor';
                showToast(`Selamat datang, ${client.coupleShort}!`, 'success');
                renderApp();
                return;
            }

            showToast('Username atau password tidak sesuai.', 'error');
        }

        function logoutUser() {
            currentUser = null;
            clientPageMode = false;
            sessionStorage.removeItem(SESSION_KEY);
            renderApp();

        function buildAnalogClockMarkup() {
            const items = clockMode === 'hour'
                ? Array.from({ length: 24 }, (_, i) => i)
                : [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];

            return `
                <div class="space-y-2 text-center">
                    <div class="inline-flex rounded-xl border border-stoneborder bg-alabaster p-0.5 text-[11px] font-bold">
                        <button type="button" onclick="setClockMode('hour')"
                            class="px-2.5 py-1 rounded-lg ${clockMode === 'hour' ? 'bg-charcoal-900 text-white' : 'text-charcoal-700'}">
                            Jam (00-23)
                        </button>
                        <button type="button" onclick="setClockMode('minute')"
                            class="px-2.5 py-1 rounded-lg ${clockMode === 'minute' ? 'bg-charcoal-900 text-white' : 'text-charcoal-700'}">
                            Menit (00-55)
                        </button>
                    </div>
                    <div class="analog-clock-circle">
                        <div class="analog-clock-center"></div>
                        ${items.map((val, idx) => {
                            const isOuter = clockMode === 'minute' || val < 12;
                            const stepIndex = clockMode === 'minute' ? idx : (val % 12);
                            const angleDeg = stepIndex * 30 - 90;
                            const angleRad = (angleDeg * Math.PI) / 180;
                            const radius = isOuter ? 74 : 47;
                            const x = Math.cos(angleRad) * radius;
                            const y = Math.sin(angleRad) * radius;
                            const label = String(val).padStart(2, '0');
                            return `
                                <button type="button" onclick="pickAnalogClockValue('${label}')"
                                    style="transform: translate(calc(-50% + ${x.toFixed(1)}px), calc(-50% + ${y.toFixed(1)}px));"

        function setClockMode(mode) {
            clockMode = mode;
            const holder = document.getElementById('analog-clock-holder');
            if (holder) holder.innerHTML = buildAnalogClockMarkup();
        }

        function setClockTarget(field) {
            clockTargetField = field;
            clockMode = 'hour';
            const label = document.getElementById('clock-target-label');
            if (label) label.textContent = field === 'start' ? 'Jam Mulai' : 'Jam Selesai';
            setClockMode('hour');
        }

        function pickAnalogClockValue(valStr) {
            const inputId = clockTargetField === 'start' ? 'rd-start' : 'rd-end';
            const inputEl = document.getElementById(inputId);
            if (!inputEl) return;
            const current = (inputEl.value || '08:00').split(':');
            const hh = current[0] || '08';
            const mm = current[1] || '00';
            if (clockMode === 'hour') {
                inputEl.value = `${valStr}:${mm}`;
                setClockMode('minute');
            } else {
                inputEl.value = `${hh}:${valStr}`;
                if (clockTargetField === 'start') {
                    setClockTarget('end');
                }
            }
            updateModalDurationPreview();
        }

        function updateModalDurationPreview() {
            const s = document.getElementById('rd-start')?.value || '';
            const e = document.getElementById('rd-end')?.value || '';
            const prev = document.getElementById('rd-duration-preview');
            if (!prev) return;
            const txt = computeRundownDurationText(`${s} - ${e}`, '');
            prev.textContent = txt || 'Durasi otomatis dihitung';
        }

        function saveRundownModal(e, editId = null) {
            e.preventDefault();
            if (currentUser?.role !== 'admin') return;
            const ev = getActiveEvent(getActiveClient());
            if (!ev) return;

            const start = (document.getElementById('rd-start')?.value || '').trim();
            const end = (document.getElementById('rd-end')?.value || '').trim();
            const time = `${start} - ${end}`;
            const durationText = computeRundownDurationText(time, '');
            const activity = (document.getElementById('rd-activity')?.value || '').trim();
            const pic = (document.getElementById('rd-pic')?.value || '').trim();
            const notes = (document.getElementById('rd-notes')?.value || '').trim();

            if (editId) {
                const item = ev.woProgress.rundown.find((r) => r.id === editId);
                if (item) {
                    item.time = time;
                    item.durationText = durationText;
                    item.activity = activity;
                    item.pic = pic;
                    item.notes = notes;
                }
            } else {
                ev.woProgress.rundown.push({
                    id: 'rd-' + Date.now(),
                    time,
                    durationText,
                    activity,
                    pic,
                    notes,
                });
            }

            ev.woProgress.lastUpdated = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            saveAppData();
            closeModal();
            showToast('Sesi rundown tersimpan.', 'success');
            renderApp();
        }

        function getInvoiceTotals(inv) {
            const items = Array.isArray(inv?.items) ? inv.items : [];
            const subtotal = items.reduce((sum, it) => sum + (Number(it.qty) || 0) * (Number(it.unitPrice) || 0), 0);
            const discount = Number(inv?.discount) || 0;
            const afterDiscount = Math.max(0, subtotal - discount);
            const taxPercent = Number(inv?.taxPercent) || 0;
            const taxAmount = Math.round((afterDiscount * taxPercent) / 100);
            const grandTotal = afterDiscount + taxAmount;
            return { subtotal, discount, taxPercent, taxAmount, grandTotal };
        }

        function saveInvoiceModal(e, editId = null) {
            e.preventDefault();
            if (currentUser?.role !== 'admin') return;
            const ev = getActiveEvent(getActiveClient());
            if (!ev) return;

            const rows = Array.from(document.querySelectorAll('#inv-items-rows .inv-row'));
            const items = rows.map((r, idx) => ({
                id: 'it-' + Date.now() + '-' + idx,
                name: (r.querySelector('.inv-it-name')?.value || '').trim() || 'Layanan WO',
                description: (r.querySelector('.inv-it-desc')?.value || '').trim(),
                qty: Math.max(1, Number(r.querySelector('.inv-it-qty')?.value) || 1),
                unitPrice: Number(r.querySelector('.inv-it-price')?.value) || 0,
            }));

            const payload = {
                id: editId || 'inv-' + Date.now(),
                invoiceNumber: (document.getElementById('inv-num')?.value || '').trim(),
                status: document.getElementById('inv-status')?.value || 'UNPAID',
                paymentTerms: (document.getElementById('inv-terms')?.value || '').trim(),
                issueDate: document.getElementById('inv-issue')?.value || '',
                dueDate: document.getElementById('inv-due')?.value || '',
                discount: Number(document.getElementById('inv-disc')?.value) || 0,
                taxPercent: Number(document.getElementById('inv-tax')?.value) || 0,
                notes: (document.getElementById('inv-notes')?.value || '').trim(),
                items,
            };

            if (editId) {
                const idx = ev.invoices.findIndex((i) => i.id === editId);
                if (idx !== -1) ev.invoices[idx] = payload;
            } else {
                ev.invoices.unshift(payload);
            }

            saveAppData();
            closeModal();
            showToast('Invoice tersimpan.', 'success');
            renderApp();
        }

            brief.guestEstimate = document.getElementById('br-guests')?.value || '';
            brief.conceptTheme = document.getElementById('br-theme')?.value || '';
            brief.colorPalette = document.getElementById('br-palette')?.value || '';
            brief.dietaryNotes = document.getElementById('br-dietary')?.value || '';
            brief.additionalNotes = document.getElementById('br-notes')?.value || '';

                const id = inp.getAttribute('data-cf-id');
                const found = (brief.customFields || []).find((c) => c.id === id);

                                        <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button type="button" onclick="moveTabOrder(${idx}, 1)" ${idx === order.length - 1 ? 'disabled' : ''}
                                        class="p-1.5 rounded-xl bg-white border border-stoneborder disabled:opacity-40">
                                        <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="flex justify-end">
                        <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-2xl bg-charcoal-900 text-white text-xs font-bold">Selesai</button>
                    </div>
                </div>
            `);
        }

        function moveTabOrder(index, dir) {
            if (currentUser?.role !== 'admin') return;
            const cl = getActiveClient();
            if (!cl) return;
            const arr = [...(cl.tabOrder || DEFAULT_TABS)];
            const target = index + dir;
            if (target < 0 || target >= arr.length) return;
            [arr[index], arr[target]] = [arr[target], arr[index]];
            cl.tabOrder = arr;
            saveAppData();
            openTabOrderModal();
            renderApp();
        }

        function openRoleAccessModal() {
            if (currentUser?.role !== 'admin') return;
            const cl = getActiveClient();
            if (!cl) return;
            const crewTabs = cl.roleAccess?.crewTabs || [];
            const clientTabs = cl.roleAccess?.clientTabs || [];
            const crewPerms = cl.roleAccess?.crewPermissions || {};
            const clientPerms = cl.roleAccess?.clientPermissions || {};

            openModal(`
                <div class="bg-white rounded-3xl border border-stoneborder w-full max-w-3xl p-6 space-y-4 shadow-xl my-auto">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-[10px] font-extrabold uppercase tracking-widest text-champagne-600">Tab Visibility &amp; Permissions</div>
                            <h3 class="font-editorial text-2xl font-bold text-charcoal-900">Pengaturan Tab per Role (Tampil / Sembunyikan &amp; Edit / View Saja)</h3>
                        </div>
                        <button type="button" onclick="closeModal()" class="p-1.5 rounded-xl hover:bg-alabaster"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <form onsubmit="saveRoleAccessModal(event)" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-3.5 rounded-2xl bg-alabaster border border-stoneborder/70 space-y-2">
                                <div class="text-xs font-extrabold uppercase text-champagne-600">Role Crew WO (Tampil &amp; Mode Akses)</div>
                                ${DEFAULT_TABS.map((key) => {
                                    const isVisible = crewTabs.includes(key);
                                    const mode = crewPerms[key] === 'view' ? 'view' : 'edit';
                                    return `
                                        <div class="flex items-center justify-between gap-2 py-1 border-b border-stoneborder/50 last:border-none">
                                            <label class="flex items-center gap-2 text-xs font-semibold text-charcoal-900">
                                                <input type="checkbox" name="crewTab" value="${key}" ${isVisible ? 'checked' : ''} class="rounded accent-charcoal-900" />
                                                <span>${escapeHtml(TAB_META[key].label)}</span>
                                            </label>
                                            <select name="crewPerm_${key}" class="px-2 py-1 rounded-lg border border-stoneborder bg-white text-[11px] font-bold">
                                                <option value="edit" ${mode === 'edit' ? 'selected' : ''}>Bisa Edit</option>
                                                <option value="view" ${mode === 'view' ? 'selected' : ''}>View Saja</option>
                                            </select>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                            <div class="p-3.5 rounded-2xl bg-alabaster border border-stoneborder/70 space-y-2">
                                <div class="text-xs font-extrabold uppercase text-sage-700">Role Client Portal (Tampil &amp; Mode Akses)</div>
                                ${DEFAULT_TABS.map((key) => {
                                    const isVisible = clientTabs.includes(key);
                                    const mode = clientPerms[key] === 'edit' ? 'edit' : 'view';
                                    return `
                                        <div class="flex items-center justify-between gap-2 py-1 border-b border-stoneborder/50 last:border-none">
                                            <label class="flex items-center gap-2 text-xs font-semibold text-charcoal-900">
                                                <input type="checkbox" name="clientTab" value="${key}" ${isVisible ? 'checked' : ''} class="rounded accent-charcoal-900" />
                                                <span>${escapeHtml(TAB_META[key].label)}</span>
                                            </label>
                                            <select name="clientPerm_${key}" class="px-2 py-1 rounded-lg border border-stoneborder bg-white text-[11px] font-bold">
                                                <option value="view" ${mode === 'view' ? 'selected' : ''}>View Saja</option>
                                                <option value="edit" ${mode === 'edit' ? 'selected' : ''}>Bisa Edit</option>
                                            </select>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        <div class="flex justify-end gap-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-2xl border border-stoneborder text-xs font-bold">Batal</button>
                            <button type="submit" class="px-5 py-2 rounded-2xl bg-charcoal-900 text-white text-xs font-bold">Simpan Akses</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function saveRoleAccessModal(e) {
            e.preventDefault();
            if (currentUser?.role !== 'admin') return;
            const cl = getActiveClient();
            if (!cl) return;
            const crewChecked = Array.from(document.querySelectorAll('input[name="crewTab"]:checked')).map((el) => el.value);
            const clientChecked = Array.from(document.querySelectorAll('input[name="clientTab"]:checked')).map((el) => el.value);
            const crewPermissions = {};
            const clientPermissions = {};
            DEFAULT_TABS.forEach((key) => {
                crewPermissions[key] = document.querySelector(`select[name="crewPerm_${key}"]`)?.value || 'edit';
                clientPermissions[key] = document.querySelector(`select[name="clientPerm_${key}"]`)?.value || 'view';
            });
            cl.roleAccess = {
                crewTabs: crewChecked.length ? crewChecked : ['vendor'],
                clientTabs: clientChecked.length ? clientChecked : ['vendor'],
                crewPermissions,
                clientPermissions,
            };
            saveAppData();
            closeModal();
            showToast('Hak akses tab & mode edit/view diperbarui.', 'success');
            renderApp();
        }

        // =====================================================================
        // 15. CLIENT PORTAL EXPERIENCE (APPROVAL RUNDOWN, CATATAN & WA PLANNER)
        // =====================================================================
        function approveRundownByClient() {
            const ev = getActiveEvent(getActiveClient());
            if (!ev) return;
            ev.woProgress = ev.woProgress || createDefaultWoProgress(ev.eventName, ev.venue);
            ev.woProgress.clientApproved = !ev.woProgress.clientApproved;
            ev.woProgress.clientApprovedAt = new Date().toLocaleDateString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
            });
            saveAppData();
            showToast(
                ev.woProgress.clientApproved
                    ? 'Rundown berhasil ditandai Disetujui oleh Klien!'
                    : 'Status persetujuan klien dibatalkan.',
                'success'
            );
            renderApp();
        }

        function openClientFeedbackModal(topic = 'umum') {
            const client = getActiveClient();
            const ev = getActiveEvent(client);
            if (!client || !ev) return;
            const defaultTopic = topic === 'rundown' ? 'Request Revisi Rundown' : 'Catatan / Permintaan Klien';

            openModal(`
                <div class="bg-white rounded-3xl border border-stoneborder w-full max-w-md p-6 space-y-4 shadow-xl">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-[10px] font-extrabold uppercase tracking-widest text-champagne-600">Client Portal</div>
                            <h3 class="font-editorial text-2xl font-bold text-charcoal-900">Kirim Catatan ke Tim WO</h3>
                        </div>
                        <button type="button" onclick="closeModal()" class="p-1.5 rounded-xl hover:bg-alabaster"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <form onsubmit="submitClientFeedback(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold mb-1">Topik</label>
                            <input id="cf-topic" type="text" required value="${escapeHtml(defaultTopic)}"
                                class="w-full px-3.5 py-2 rounded-2xl border border-stoneborder bg-alabaster text-sm" />
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1">Detail Pesan / Revisi</label>
                            <textarea id="cf-message" rows="3" required placeholder="Tuliskan catatan, permintaan lagu, urutan foto keluarga, atau penyesuaian jadwal..."
                                class="w-full px-3.5 py-2.5 rounded-2xl border border-stoneborder bg-alabaster text-sm"></textarea>
                        </div>
                        <div class="flex flex-wrap justify-end gap-2 pt-1">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-2xl border border-stoneborder text-xs font-bold">Batal</button>
                            <button type="submit" class="px-4 py-2 rounded-2xl bg-charcoal-900 text-white text-xs font-bold">Simpan ke Portal</button>
                            <button type="button" onclick="submitClientFeedbackAndWa()" class="px-4 py-2 rounded-2xl bg-sage-600 text-white text-xs font-bold">Simpan &amp; Kirim WA</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function saveClientFeedbackRecord(topic, message) {
            const client = getActiveClient();
            const ev = getActiveEvent(client);
            if (!client || !ev) return null;

            const today = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            ev.woProgress = ev.woProgress || createDefaultWoProgress(ev.eventName, ev.venue);
            ev.woProgress.revisions = Array.isArray(ev.woProgress.revisions) ? ev.woProgress.revisions : [];
            ev.woProgress.revisions.unshift({
                id: 'rev-' + Date.now(),
                effectiveDate: today,
                status: 'Client Note',
                note: `[${topic}] ${message}`,
                author: `${client.coupleShort} (Klien)`,
                createdAt: today,
            });
            saveAppData();
            return { client, ev };
        }

        function submitClientFeedback(e) {
            e.preventDefault();
            const topic = (document.getElementById('cf-topic')?.value || 'Catatan Klien').trim();
            const message = (document.getElementById('cf-message')?.value || '').trim();
            if (!message) return;
            saveClientFeedbackRecord(topic, message);
            closeModal();
            showToast('Catatan Anda telah tercatat untuk tim WO.', 'success');
            renderApp();
        }

        function submitClientFeedbackAndWa() {
            const topic = (document.getElementById('cf-topic')?.value || 'Catatan Klien').trim();
            const message = (document.getElementById('cf-message')?.value || '').trim();
            if (!message) {
                showToast('Mohon isi detail pesan terlebih dahulu.', 'error');
                return;
            }
            const res = saveClientFeedbackRecord(topic, message);
            closeModal();
            renderApp();
            if (res) {
                const text = [
                    `Halo tim *MOMENTUMATES WO*,`,
                    `Kami dari *${res.client.coupleShort}* (${res.ev.eventName}) mengirim catatan baru:`,
                    `*Topik:* ${topic}`,
                    `*Pesan:* ${message}`,
                ].join('\n');
                openWhatsAppMessage('6287777766088', text);
            }
        }

        function contactWoAdminWhatsApp() {
            const client = getActiveClient();
            const ev = getActiveEvent(client);
            const text = `Halo tim *MOMENTUMATES WO*, kami dari *${client?.coupleShort || 'Klien'}* (${ev?.eventName || 'Wedding Day'}) ingin berkoordinasi mengenai persiapan acara.`;
            openWhatsAppMessage('6287777766088', text);
        }

        // =====================================================================
        // 16. MAIN APP RENDERER
        // =====================================================================
        function renderApp() {
            const root = document.getElementById('app');
            if (!root) return;

            if (!currentUser) {
                root.innerHTML = renderLoginScreen();
                lucide.createIcons();
                return;
            }

            const client = getActiveClient();
            const ev = getActiveEvent(client);
            if (!client || !ev) {
                root.innerHTML = `${renderTopBar()}<main class="p-8 text-center text-sm">Data klien tidak tersedia.</main>`;
                lucide.createIcons();
                return;
            }

            let tabContent = '';
            if (activeTab === 'vendor') tabContent = renderVendorProgressTab(client, ev);
            else if (activeTab === 'vendorlist') tabContent = renderVendorListTab(client, ev);
            else if (activeTab === 'rundown') tabContent = renderRundownTab(client, ev);
            else if (activeTab === 'biodata') tabContent = renderBiodataTab(client, ev);
            else if (activeTab === 'package') tabContent = renderPackagePaymentTab(client, ev);
            else if (activeTab === 'brief') tabContent = renderBriefTab(client, ev);
            else if (activeTab === 'ops') tabContent = renderOpsTab(client, ev);
            else if (activeTab === 'finance') tabContent = renderFinanceTab(client, ev);

            root.innerHTML = `
                ${renderTopBar()}
                <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-6 py-5 sm:py-7 space-y-5">
                    ${renderWorkspaceHeader(client, ev)}
                    ${renderTabBar(client)}
                    ${tabContent}
                </main>
                <footer class="max-w-6xl w-full mx-auto px-4 py-6 text-center text-[11px] text-charcoal-700/70">
                    MOMENTUMATES WEDDING ORGANIZER &bull; Client &amp; Vendor Progress Portal
                </footer>
            `;

            lucide.createIcons();
        }

        // =====================================================================
        // 17. BOOTSTRAP APLIKASI
        // =====================================================================
        document.addEventListener('DOMContentLoaded', () => {
            applyDeviceMode();
            initParallaxListeners();
            loadInitialState();
            renderApp();
        });
    </script>
</body>
</html>
