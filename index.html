<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIEXIANDE — User & Workspace Access</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f2430;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2c3240;
      --accent: #e5b869;
      --accent-text: #111317;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .session-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--panel-2);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    h1, h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
    }

    input, select {
      width: 100%;
      padding: 9px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
    }

    input[readonly] {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .checkbox-field {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
    }

    .checkbox-field input {
      width: auto;
    }

    .checkbox-field label {
      margin: 0;
      color: var(--text);
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 9px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    button.danger {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 20px;
    }

    .status.ok { color: var(--success); }
    .status.err { color: var(--danger); }

    .table-wrap {
      overflow-x: auto;
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      background: var(--panel-2);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="brand">LIEXIANDE WORKSPACE</div>
      <div id="sessionBar" class="session-info hidden">
        <span>Login sebagai: <strong id="activeUserLabel"></strong></span>
        <span id="activeRoleBadge" class="badge"></span>
        <button type="button" id="btnLogout">Logout</button>
      </div>
    </div>

    <!-- LOGIN CARD -->
    <section id="loginCard" class="card">
      <h1>Login</h1>
      <form id="loginForm" class="grid-form">
        <div class="field">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required />
        </div>
        <div class="actions">
          <button type="submit" class="primary">Masuk</button>
        </div>
      </form>
      <div id="loginStatus" class="status"></div>
    </section>

    <!-- NON-SUPERADMIN DASHBOARD CARD -->
    <section id="standardDashboard" class="card hidden">
      <h2>Dashboard</h2>
      <p style="margin:0; color:var(--muted); font-size:14px;">
        Akun kamu aktif dengan role <strong id="standardRoleText"></strong>. Menu pengelolaan user khusus tersedia untuk <strong>superadmin</strong>.
      </p>
    </section>

    <!-- SUPERADMIN MANAGE USERS PANEL -->
    <section id="superadminPanel" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
        <h2 style="margin:0;">Manage Users (Superadmin)</h2>
        <button type="button" id="btnRefreshUsers">Refresh Daftar</button>
      </div>

      <form id="userForm" class="grid-form">
        <input type="hidden" id="formMode" value="create" />

        <div class="field">
          <label for="userUsername">Username</label>
          <input type="text" id="userUsername" placeholder="contoh: editor01" required />
        </div>

        <div class="field">
          <label for="userRole">Role</label>
          <select id="userRole">
            <option value="superadmin">superadmin</option>
            <option value="admin">admin</option>
            <option value="editor">editor</option>
            <option value="viewer">viewer</option>
          </select>
        </div>

        <div class="field">
          <label for="userPassword">Password</label>
          <input type="password" id="userPassword" placeholder="Min. 6 karakter (kosongkan saat edit jika tetap)" />
        </div>

        <div class="field checkbox-field">
          <input type="checkbox" id="userIsPrimary" />
          <label for="userIsPrimary">Primary Account</label>
        </div>

        <div class="actions">
          <button type="submit" id="btnSubmitUser" class="primary">Buat User</button>
          <button type="button" id="btnCancelEdit">Reset</button>
        </div>
      </form>

      <div id="manageStatus" class="status"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>Primary</th>
              <th>Updated At</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const SESSION_KEY = 'liexiande_session_v1';

    function getSession() {
      try {
        return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
      } catch (_) {
        return null;
      }
    }

    function setSession(data) {
      if (data) {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(data));
      } else {
        sessionStorage.removeItem(SESSION_KEY);
      }
    }

    function setStatus(elId, message, type = '') {
      const el = document.getElementById(elId);
      el.textContent = message || '';
      el.className = 'status' + (type ? ' ' + type : '');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    // Wrapper google.script.run menjadi Promise
    function callGs(fnName, ...args) {
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          reject(new Error('google.script.run tidak tersedia di konteks ini.'));
          return;
        }
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => reject(new Error(err && err.message ? err.message : String(err))))
          [fnName](...args);
      });
    }

    function renderAuthState() {
      const session = getSession();
      const loginCard = document.getElementById('loginCard');
      const sessionBar = document.getElementById('sessionBar');
      const standardDashboard = document.getElementById('standardDashboard');
      const superadminPanel = document.getElementById('superadminPanel');

      if (!session || !session.token || !session.user) {
        loginCard.classList.remove('hidden');
        sessionBar.classList.add('hidden');
        standardDashboard.classList.add('hidden');
        superadminPanel.classList.add('hidden');
        return;
      }

      loginCard.classList.add('hidden');
      sessionBar.classList.remove('hidden');
      document.getElementById('activeUserLabel').textContent = session.user.username;
      document.getElementById('activeRoleBadge').textContent = session.user.role;

      if (String(session.user.role).toLowerCase() === 'superadmin') {
        standardDashboard.classList.add('hidden');
        superadminPanel.classList.remove('hidden');
        loadUsers();
      } else {
        superadminPanel.classList.add('hidden');
        standardDashboard.classList.remove('hidden');
        document.getElementById('standardRoleText').textContent = session.user.role;
      }
    }

    async function loadUsers() {
      const session = getSession();
      if (!session || !session.token) return;

      try {
        setStatus('manageStatus', 'Memuat daftar user...');
        const users = await callGs('getAllUsers', session.token);
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';

        if (!users || users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted);">Belum ada user terdaftar.</td></tr>';
          setStatus('manageStatus', '');
          return;
        }

        users.forEach(user => {
          const tr = document.createElement('tr');
          const safeJson = escapeHtml(JSON.stringify(user));
          const delBtnHtml = user.isPrimary
            ? ''
            : `<button type="button" class="danger" onclick="handleDeleteUser('${escapeHtml(user.username)}')">Hapus</button>`;

          tr.innerHTML = `
            <td>${escapeHtml(user.username)}</td>
            <td>${escapeHtml(user.role)}</td>
            <td>${user.isPrimary ? 'Yes' : 'No'}</td>
            <td>${escapeHtml(user.updatedAt || '-')}</td>
            <td class="actions">
              <button type="button" onclick='startEditUser("${safeJson}")'>Edit</button>
              ${delBtnHtml}
            </td>
          `;
          tbody.appendChild(tr);
        });

        setStatus('manageStatus', `Total user: ${users.length}`, 'ok');
      } catch (err) {
        setStatus('manageStatus', err.message, 'err');
      }
    }

    function startEditUser(encodedUserJson) {
      const user = JSON.parse(encodedUserJson);
      document.getElementById('formMode').value = 'edit';

      const inpUser = document.getElementById('userUsername');
      inpUser.value = user.username;
      inpUser.readOnly = true;

      document.getElementById('userRole').value = user.role || 'admin';
      document.getElementById('userPassword').value = '';
      document.getElementById('userIsPrimary').checked = Boolean(user.isPrimary);
      document.getElementById('btnSubmitUser').textContent = 'Simpan Perubahan';
      setStatus('manageStatus', `Mode edit untuk user "${user.username}".`);
    }

    function resetUserForm() {
      document.getElementById('formMode').value = 'create';

      const inpUser = document.getElementById('userUsername');
      inpUser.value = '';
      inpUser.readOnly = false;

      document.getElementById('userRole').value = 'admin';
      document.getElementById('userPassword').value = '';
      document.getElementById('userIsPrimary').checked = false;
      document.getElementById('btnSubmitUser').textContent = 'Buat User';
    }

    async function handleDeleteUser(username) {
      const session = getSession();
      if (!session || !session.token) return;
      if (!confirm(`Hapus user "${username}"?`)) return;

      try {
        const res = await callGs('deleteAdminUser', session.token, username);
        setStatus('manageStatus', res.message || 'User dihapus.', 'ok');
        await loadUsers();
      } catch (err) {
        setStatus('manageStatus', err.message, 'err');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        setStatus('loginStatus', 'Memverifikasi akun...');
        const res = await callGs('loginUser', username, password);
        if (!res || !res.ok || !res.token) {
          throw new Error((res && res.error) || 'Login gagal.');
        }
        setSession({ token: res.token, user: res.user });
        document.getElementById('loginForm').reset();
        setStatus('loginStatus', '');
        renderAuthState();
      } catch (err) {
        setStatus('loginStatus', err.message, 'err');
      }
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
      setSession(null);
      resetUserForm();
      renderAuthState();
    });

    document.getElementById('btnCancelEdit').addEventListener('click', () => {
      resetUserForm();
      setStatus('manageStatus', '');
    });

    document.getElementById('btnRefreshUsers').addEventListener('click', loadUsers);

    document.getElementById('userForm').addEventListener('submit', async e => {
      e.preventDefault();
      const session = getSession();
      if (!session || !session.token) return;

      const mode = document.getElementById('formMode').value;
      const payload = {
        username: document.getElementById('userUsername').value.trim(),
        role: document.getElementById('userRole').value,
        password: document.getElementById('userPassword').value,
        isPrimary: document.getElementById('userIsPrimary').checked
      };

      try {
        setStatus('manageStatus', mode === 'create' ? 'Menyimpan user baru...' : 'Mengupdate user...');
        const res = mode === 'create'
          ? await callGs('createAdminUser', session.token, payload)
          : await callGs('updateAdminUser', session.token, payload);

        setStatus('manageStatus', res.message || 'Berhasil.', 'ok');
        resetUserForm();
        await loadUsers();
      } catch (err) {
        setStatus('manageStatus', err.message, 'err');
      }
    });

    renderAuthState();
  </script>
</body>
</html>
