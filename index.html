<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOMENTUMATES WEDDING ORGANIZER — Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #111111;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e5e5;
    }
    .brand { font-weight: 700; letter-spacing: 0.06em; font-size: 14px; }
    .status { font-size: 12px; color: #555555; }
    main { max-width: 960px; margin: 24px auto; padding: 0 20px; }
    button {
      padding: 8px 14px;
      border: 1px solid #111111;
      background: #111111;
      color: #ffffff;
      cursor: pointer;
      font-size: 13px;
    }
    button.secondary { background: #ffffff; color: #111111; }
    .card {
      border: 1px solid #e5e5e5;
      padding: 16px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">MOMENTUMATES WEDDING ORGANIZER</div>
    <div id="syncStatus" class="status">Menyiapkan koneksi...</div>
  </header>

  <main>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button id="btnReload" class="secondary" type="button">Muat Ulang Data</button>
      <button id="btnSaveDemo" type="button">Simpan Perubahan State</button>
    </div>

    <div id="appContent" class="card">Memuat data dari Google Sheets...</div>
  </main>

  <script>
    // GANTI URL INI dengan Web App URL (.../exec) hasil deploy Code.gs
    const GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbyZbPdZphb-GK6d9_0rAUuOEGUgb0oCvGQifGAwd6SNDRwcyyNfAiIUjB1FgJ2kx7PS0Q/exec";

    let appState = {
      clients: []
    };

    function setSyncStatus(text) {
      document.getElementById("syncStatus").textContent = text;
    }

    /**
     * Memanggil backend GAS via POST JSON (menghindari CORS preflight OPTIONS)
     */
    async function callGasApi(payload) {
      const response = await fetch(GAS_EXEC_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error("HTTP Error: " + response.status);
      }

      const result = await response.json();
      if (!result.ok) {
        throw new Error(result.error || "Respons backend gagal.");
      }
      return result;
    }

    /**
     * Mengambil state terbaru dari Google Sheets
     */
    async function loadStateFromBackend() {
      setSyncStatus("Memuat data...");
      try {
        const res = await callGasApi({ action: "getState" });
        if (res.data) {
          appState = res.data;
        } else {
          // State awal jika database sheet masih kosong
          appState = {
            clients: [
              {
                id: "CL-001",
                projectStatus: "Active",
                coupleShort: "Pasangan Contoh",
                packageTier: "Full WO",
                events: [
                  {
                    eventName: "Wedding Day",
                    eventDate: "2027-01-01",
                    woProgress: { status: "Draft" },
                    vendors: [],
                    invoices: []
                  }
                ]
              }
            ]
          };
        }
        renderApp();
        setSyncStatus("Tersinkronisasi");
      } catch (err) {
        setSyncStatus("Gagal memuat");
        document.getElementById("appContent").textContent = "Error: " + err.message;
      }
    }

    /**
     * Menyimpan state saat ini ke Google Sheets
     */
    async function saveStateToBackend(nextState) {
      setSyncStatus("Menyimpan...");
      try {
        const res = await callGasApi({
          action: "saveState",
          state: nextState
        });
        appState = nextState;
        renderApp();
        setSyncStatus("Tersimpan (" + (res.updatedAt || "baru saja") + ")");
      } catch (err) {
        setSyncStatus("Gagal simpan");
        alert("Gagal menyimpan ke Google Sheet: " + err.message);
      }
    }

    /**
     * Render tampilan utama aplikasi
     */
    function renderApp() {
      const container = document.getElementById("appContent");
      const clients = appState.clients || [];

      if (clients.length === 0) {
        container.innerHTML = "<p>Belum ada data klien.</p>";
        return;
      }

      container.innerHTML = clients.map(c => {
        const events = c.events || [];
        const eventList = events.map(ev =>
          `<li>${ev.eventName} (${ev.eventDate || "-"}) — Rundown: ${ev.woProgress?.status || "Draft"}</li>`
        ).join("");

        return `
          <div style="margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #f0f0f0;">
            <strong>${c.coupleShort}</strong> (${c.id}) — Status: ${c.projectStatus || "Active"}
            <ul style="margin:6px 0 0 18px;">${eventList || "<li>Belum ada event</li>"}</ul>
          </div>
        `;
      }).join("");
    }

    document.getElementById("btnReload").addEventListener("click", loadStateFromBackend);

    document.getElementById("btnSaveDemo").addEventListener("click", async () => {
      const updated = structuredClone(appState);
      if (updated.clients && updated.clients[0] && updated.clients[0].events && updated.clients[0].events[0]) {
        updated.clients[0].events[0].woProgress = { status: "In Review" };
      }
      await saveStateToBackend(updated);
    });

    // Muat state saat halaman dibuka
    loadStateFromBackend();
  </script>
</body>
</html>
